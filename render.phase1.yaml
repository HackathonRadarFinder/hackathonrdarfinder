# REVIEW ONLY. Do not sync/create/deploy without owner approval. Existing service
# settings must be updated on the verified service, not duplicated as a new stack.
services:
  - type: web
    name: hackathonrdarfinder
    runtime: docker
    plan: free
    region: oregon
    branch: develop
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: "off"
    healthCheckPath: /ready
    dockerCommand: /bin/sh -c 'python -m workers.check_ready && exec uvicorn app.main:app --host 0.0.0.0 --port 8000'
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: EMAIL_MODE
        value: disabled
      - key: DISCOVERY_ENABLED
        value: "false"
