apiVersion: v1
kind: Namespace
metadata:
  name: observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'backend'
        static_configs:
          - targets: ['backend-service.hackathon-dev.svc.cluster.local:80']
      - job_name: 'frontend'
        static_configs:
          - targets: ['frontend-service.hackathon-dev.svc.cluster.local:80']
