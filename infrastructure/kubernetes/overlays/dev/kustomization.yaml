apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hackathon-dev
resources:
  - ../../base
images:
  - name: ghcr.io/hackathonradarfinder/hackathonrdarfinder/backend
    newName: ghcr.io/hackathonradarfinder/hackathonrdarfinder/backend
    newTag: PLACEHOLDER_SHA
  - name: ghcr.io/hackathonradarfinder/hackathonrdarfinder/frontend
    newName: ghcr.io/hackathonradarfinder/hackathonrdarfinder/frontend
    newTag: PLACEHOLDER_SHA
patches:
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: HorizontalPodAutoscaler
      name: backend-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
  - target:
      kind: ConfigMap
      name: hackathon-app-config
    patch: |-
      - op: replace
        path: /data/APP_ENV
        value: development
