
services:
  db:
    image: postgres:16-alpine
    container_name: hackathon-radar-db
    restart: unless-stopped

    env_file:
      - ./backend/.env

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - radar_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: hackathon-radar-backend
    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    depends_on:
      db:
        condition: service_healthy

volumes:
  radar_postgres_data:
