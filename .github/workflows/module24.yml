name: Module 2.4 offline release checks
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_call:
permissions:
  contents: read
jobs:
  module24-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install deduplication dependencies
        run: python -m pip install -r backend/modules/2.4-dedup/requirements.txt
      - name: Compile module
        run: python -m compileall -q backend/modules/2.4-dedup
      - name: Test canonical API and disposable integration
        working-directory: backend/modules/2.4-dedup
        run: python -m unittest discover -v
      - name: Evaluate illustrative labeled examples
        working-directory: backend/modules/2.4-dedup
        run: python evaluate.py
