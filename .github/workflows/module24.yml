name: Module 2.4 Dedup Regression

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'backend/modules/2.4-dedup/**'
      - '.github/workflows/module24.yml'
  push:
    branches: [develop, main]
    paths:
      - 'backend/modules/2.4-dedup/**'
      - '.github/workflows/module24.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  module24:
    name: Module 2.4 offline unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile Module 2.4 source files
        working-directory: backend/modules/2.4-dedup
        run: python -m compileall -q .
      - name: Run Module 2.4 offline regression suite
        working-directory: backend/modules/2.4-dedup
        run: python -m unittest -v test_module24
