name: Deploy PROD
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Full 40-character SHA of a successfully published protected-branch commit
        required: true
        type: string
permissions:
  contents: read
  packages: read
  actions: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
      NAMESPACE: hackathon-prod
      APPROVED_BRANCH: main
      INGRESS_HOST: ${{ vars.INGRESS_HOST }}
      TLS_SECRET: ${{ vars.TLS_SECRET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.3
      - name: Verify release provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/verify_release.py
      - name: Set image prefix
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate published image tags
        run: |
          docker manifest inspect "${IMAGE_PREFIX}/backend:${IMAGE_TAG}" >/dev/null
          docker manifest inspect "${IMAGE_PREFIX}/frontend:${IMAGE_TAG}" >/dev/null
      - uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415
        with:
          version: v1.36.1
      - name: Configure environment-scoped kubeconfig
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          test -n "$KUBE_CONFIG_DATA"
          umask 077
          printf '%s' "$KUBE_CONFIG_DATA" | base64 --decode > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
      - name: Verify provisioned namespace and secrets
        run: |
          for secret in hackathon-db-secret hackathon-app-secret ghcr-creds "$TLS_SECRET"; do
            kubectl get secret "$secret" -n "$NAMESPACE" >/dev/null
          done
      - name: Render release and migration manifests
        run: |
          kubectl kustomize infrastructure/kubernetes/overlays/prod > "$RUNNER_TEMP/rendered.yaml"
          python scripts/prepare_deployment.py "$RUNNER_TEMP/rendered.yaml" "$RUNNER_TEMP/release"
      - name: Apply configuration and migrate before rollout
        run: |
          kubectl apply -f "$RUNNER_TEMP/release/config.yaml" -n "$NAMESPACE"
          kubectl create -f "$RUNNER_TEMP/release/migration.yaml" -n "$NAMESPACE"
          kubectl wait --for=condition=complete "job/${MIGRATION_JOB}" -n "$NAMESPACE" --timeout=300s
      - name: Apply workloads and wait for rollout
        run: |
          kubectl apply -f "$RUNNER_TEMP/release/workloads.yaml" -n "$NAMESPACE"
          kubectl rollout status deployment/backend -n "$NAMESPACE" --timeout=300s
          kubectl rollout status deployment/frontend -n "$NAMESPACE" --timeout=300s
      - name: Release summary
        run: |
          printf 'Namespace: %s\nImage SHA: %s\n' "$NAMESPACE" "$IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary kubeconfig
        if: always()
        run: rm -f "$RUNNER_TEMP/kubeconfig"
