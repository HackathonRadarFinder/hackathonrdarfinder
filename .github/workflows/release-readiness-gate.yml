name: Release Readiness Gate

on:
  pull_request:
    branches:
      - main
      - 'release/**'
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  validate-release-readiness:
    name: Production Readiness & Release Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Production Build
        run: npm run build

      - name: Run Dependency Security Audit
        run: npm audit --audit-level=high

      - name: Execute Production Readiness Verification Script
        run: |
          chmod +x scripts/verify-release-readiness.sh
          ./scripts/verify-release-readiness.sh

      - name: Upload Release Readiness Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-readiness-report
          path: .reports/release-readiness-report.md
