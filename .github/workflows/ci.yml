name: CI
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: radar_ci
          POSTGRES_USER: radar_ci
          POSTGRES_PASSWORD: isolated-ci-password
        ports: [5432:5432]
        options: >-
          --health-cmd="pg_isready -U radar_ci -d radar_ci"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgresql+psycopg://radar_ci:isolated-ci-password@127.0.0.1:5432/radar_ci
      SECRET_KEY: isolated-ci-signing-key-at-least-32-characters
      ENVIRONMENT: test
      DEBUG: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Check dependency consistency
        working-directory: backend
        run: python -m pip check
      - name: Validate migrations on disposable PostgreSQL
        working-directory: backend
        run: python -m alembic upgrade head
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest tests -q --junitxml=test-results.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: backend-test-results
          path: backend/test-results.xml
          retention-days: 7
  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        run: npm run build
  infrastructure-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.3 pytest==8.3.3
      - uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415
        with:
          version: v1.36.1
      - name: Validate workflows and rendered overlays
        run: python scripts/validate_ops.py
      - name: Lint GitHub Actions workflows
        run: python scripts/run_actionlint.py
      - name: Test deployment and recovery safeguards
        run: python -m pytest tests/operations -q
      - name: Validate backup shell syntax
        run: for script in infrastructure/backup/*.sh; do bash -n "$script"; done
      - name: Validate Compose without reading local credentials
        run: |
          printf 'POSTGRES_DB=radar_ci\nPOSTGRES_USER=radar_ci\nPOSTGRES_PASSWORD=isolated-ci-password\nDATABASE_URL=postgresql+psycopg://radar_ci:isolated-ci-password@db:5432/radar_ci\nSECRET_KEY=isolated-ci-signing-key-at-least-32-characters\n' > backend/.env
          docker compose config --quiet
  docker-build:
    needs: [backend-test, frontend-test, infrastructure-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build backend image
        run: docker build -t hackathon-radar-backend:test ./backend
      - name: Build frontend image
        run: docker build -t hackathon-radar-frontend:test ./frontend
      - name: Check Nginx configuration and API proxy
        run: |
          docker network create radar-ci
          docker run -d --name backend --network radar-ci -e DATABASE_URL=sqlite+pysqlite:// -e SECRET_KEY=isolated-ci-signing-key-at-least-32-characters hackathon-radar-backend:test
          docker run --rm --network radar-ci hackathon-radar-frontend:test nginx -t
          docker run -d --name frontend --network radar-ci hackathon-radar-frontend:test
          docker exec frontend wget -qO- http://127.0.0.1:8080/health
          for attempt in $(seq 1 30); do
            printf 'Backend proxy health check attempt %s/30\n' "$attempt"
            if docker exec frontend wget -qO- http://127.0.0.1:8080/api/health; then exit 0; fi
            sleep 2
          done
          exit 1
