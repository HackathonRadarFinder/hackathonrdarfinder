name: CI
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main, 'release/**']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: radar_ci
          POSTGRES_USER: radar_ci
          POSTGRES_PASSWORD: isolated-ci-password
        ports: [5432:5432]
        options: >-
          --health-cmd="pg_isready -U radar_ci -d radar_ci"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgresql+psycopg://radar_ci:isolated-ci-password@127.0.0.1:5432/radar_ci
      SECRET_KEY: isolated-ci-signing-key-at-least-32-characters
      ENVIRONMENT: test
      DEBUG: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt -r modules/2.2-collector/requirements.txt -r radar_collector/requirements.txt
      - name: Check dependency consistency
        working-directory: backend
        run: python -m pip check
      - name: Validate migrations on disposable PostgreSQL
        working-directory: backend
        run: python -m alembic upgrade head
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest tests -q --junitxml=test-results.xml
      - name: Test offline collector
        working-directory: backend/modules/2.2-collector
        run: python -m pytest -q
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: backend-test-results
          path: backend/test-results.xml
          retention-days: 7
  module24-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install deduplication dependencies
        run: python -m pip install -r backend/modules/2.4-dedup/requirements.txt
      - name: Test persisted deduplication and edition boundaries
        working-directory: backend/modules/2.4-dedup
        run: python -m unittest discover -v
      - name: Evaluate illustrative pairs
        working-directory: backend/modules/2.4-dedup
        run: python evaluate.py
  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install offline import integration dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/radar_collector/requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Test frontend API client
        working-directory: frontend
        run: npm run test
      - name: Build frontend
        working-directory: frontend
        env:
          WRANGLER_SEND_METRICS: "false"
        run: npm run build:pages
  fixture-portability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install fixture integration dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/radar_collector/requirements.txt
      - name: Verify fixture byte hashes and read-only startup
        working-directory: backend
        run: python -m pytest tests/test_reviewed_public_import.py tests/test_phase1_readiness_security.py radar_collector/tests -q
  pages-acceptance:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install disposable backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Install Pages test dependencies
        working-directory: frontend
        run: npm ci
      - name: Install disposable browser
        working-directory: frontend
        run: npx playwright-core install --with-deps chromium
      - name: Build compiled Pages router and assets
        working-directory: frontend
        run: npm run build:pages
      - name: Verify Pages routing, auth contracts and browser accessibility locally
        working-directory: frontend
        run: npm run test:pages
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pages-browser-acceptance
          path: .test-support/browser-evidence
          retention-days: 7
  infrastructure-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.3 pytest==8.3.3
      - uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415
        with:
          version: v1.36.1
      - name: Validate workflows and rendered overlays
        run: python scripts/validate_ops.py
      - name: Lint GitHub Actions workflows
        run: python scripts/run_actionlint.py
      - name: Test deployment and recovery safeguards
        run: python -m pytest tests/operations -q
      - name: Validate backup shell syntax
        run: for script in infrastructure/backup/*.sh; do bash -n "$script"; done
      - name: Validate Compose without reading local credentials
        run: |
          printf 'POSTGRES_DB=radar_ci\nPOSTGRES_USER=radar_ci\nPOSTGRES_PASSWORD=isolated-ci-password\nDATABASE_URL=postgresql+psycopg://radar_ci:isolated-ci-password@db:5432/radar_ci\nSECRET_KEY=isolated-ci-signing-key-at-least-32-characters\n' > backend/.env
          docker compose config --quiet
  docker-build:
    needs: [backend-test, frontend-test, infrastructure-check, module24-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build backend image
        run: docker build -t hackathon-radar-backend:test ./backend
      - name: Build frontend image
        run: docker build -t hackathon-radar-frontend:test ./frontend
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install release acceptance dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/radar_collector/requirements.txt -r backend/modules/2.2-collector/requirements.txt
      - name: Install browser acceptance dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright-core install --with-deps chromium
      - name: Verify built images and complete PostgreSQL release journeys
        run: python scripts/postgres_acceptance.py --backend-image hackathon-radar-backend:test --frontend-image hackathon-radar-frontend:test --out .test-support/ci-acceptance
      - name: Verify production Compose scheduler restart and recovery
        env:
          ACCEPTANCE_BACKEND_IMAGE: hackathon-radar-backend:test
          ACCEPTANCE_FRONTEND_IMAGE: hackathon-radar-frontend:test
        run: python scripts/verify_production_compose.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release-acceptance-evidence
          path: |
            .test-support/ci-acceptance
            .test-support/production-compose-report.json
          retention-days: 7
  release-gate:
    name: release-gate
    if: always()
    needs: [backend-test, module24-test, frontend-test, fixture-portability, pages-acceptance, infrastructure-check, docker-build]
    runs-on: ubuntu-latest
    steps:
      - name: Require success from every acceptance job (skips also block)
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os, sys
          results = json.loads(os.environ['JOB_RESULTS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              print('Release blocked by: ' + ', '.join(sorted(failed)))
              sys.exit(1)
          print('All required acceptance jobs passed')
          PY
