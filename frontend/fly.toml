# Dedicated Fly web app; the existing API app is hackathonrdarfinder.
# Replace the app name only if this name is already registered.
app = "hackathonrdarfinder-web"
primary_region = "sin"

[build]
dockerfile = "Dockerfile.fly"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0

[[http_service.checks]]
grace_period = "15s"
interval = "30s"
method = "GET"
timeout = "5s"
path = "/health"

[[vm]]
memory = "256mb"
cpu_kind = "shared"
cpus = 1
