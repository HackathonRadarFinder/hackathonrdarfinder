# Fly frontend exposes one origin to the browser and forwards API calls to
# the existing Fly backend. The /api/ prefix is stripped by proxy_pass /.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass https://hackathonrdarfinder.fly.dev/;
        proxy_ssl_server_name on;
        proxy_set_header Host hackathonrdarfinder.fly.dev;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri /index.html;
    }
}
