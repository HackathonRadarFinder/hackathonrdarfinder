app = "hackathonrdarfinder"
primary_region = "sin"

[build]
dockerfile = "Dockerfile"

[env]
ENVIRONMENT = "production"
DEBUG = "false"
EMAIL_MODE = "disabled"

[deploy]
release_command = "alembic upgrade head"

[http_service]
internal_port = 8000
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0

[[http_service.checks]]
grace_period = "30s"
interval = "30s"
method = "GET"
timeout = "5s"
path = "/ready"

[[vm]]
memory = "1gb"
cpu_kind = "shared"
cpus = 1
